# The ONE object applied by hand (`make k8s-gitops`): app-of-apps. It syncs deploy/argocd/apps,
# which holds the real Applications. From here on, the cluster's state is a git commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: masternova-root
  namespace: argocd
spec:
  project: masternova-root
  source:
    repoURL: https://github.com/b-nimai/Masternova-Spring.git
    targetRevision: main
    path: deploy/argocd/apps
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: # a sync that lost a race (a CRD or webhook not yet served on a fresh cluster) is retried:
      # Argo CD never re-attempts a failed automated sync of the same commit on its own
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
