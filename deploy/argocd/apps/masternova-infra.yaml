# The data layer. Wave 0: the root syncs it first and waits until it's Healthy (the Application
# health check in deploy/k3d/argocd-values.yaml) — the apps' PreSync migration needs the database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: masternova-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # ⭐ No resources-finalizer: deleting this Application must never cascade into the database.
spec:
  project: masternova
  source:
    repoURL: https://github.com/b-nimai/Masternova-Spring.git
    targetRevision: main
    path: deploy/helm/masternova-infra
    helm:
      releaseName: masternova-infra # = the chart's app.kubernetes.io/instance
      valueFiles: [values-local.yaml]
  destination: { server: https://kubernetes.default.svc, namespace: masternova }
  syncPolicy:
    automated:
      prune: true # removed from git = removed from the cluster (the CNPG Cluster opts out, see its template)
      selfHeal: true # a `kubectl edit` is reverted: git is the only way to change the cluster
    retry: # a sync that lost a race (a CRD or webhook not yet served on a fresh cluster) is retried:
      # Argo CD never re-attempts a failed automated sync of the same commit on its own
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
