{{- if .Values.mailpit.enabled }}
{{- $c := dict "root" . "component" "mailpit" -}}
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {{- include "infra.labels" $c | nindent 4 }}
spec:
  selector: {{- include "infra.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- include "infra.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "infra.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "infra.labels" $c | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
