{{- $p := .Values.postgres -}}
# One object; the CloudNativePG operator makes the pods, PVCs, Services (-rw / -ro / -r),
# replication and failover from it (devops/06 §4.1).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: masternova-db
  labels: {{- include "infra.labels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    # ⭐ Argo CD never deletes the database: not when it disappears from the chart (Prune=false),
    #    not when the Application is deleted (Delete=false). Removing data is a human's decision.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep # the same promise to `helm uninstall`
spec:
  instances: {{ $p.instances }}
  imageName: {{ $p.image }}
  primaryUpdateStrategy: unsupervised # a minor upgrade: standbys first, then the primary
  # ⭐ D5.4: switchover, not the default `restart`. Adding the backup sidecar restarted the primary IN
  #    PLACE, and its node took 10 min to pull the new image: 10 min with no database. Switchover
  #    promotes the standby (already updated, already running) first, then restarts the old primary
  #    as a replica: seconds of read-only, not minutes of nothing.
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      database: {{ $p.database }}
      owner: {{ $p.owner }}
      secret: { name: {{ $p.ownerSecret }} } # OUR Secret: the apps mount the same one
      # As the superuser, once: pgvector isn't a trusted extension, so the owner can't create it
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS citext
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
  storage:
    size: {{ $p.storage }}
  resources: {{- toYaml $p.resources | nindent 4 }}
  postgresql:
    parameters:
      {{- toYaml $p.parameters | nindent 6 }}
      {{- if $p.backup.enabled }}
      archive_timeout: {{ $p.backup.archiveTimeout }} # switch WAL segments at least this often: the RPO
      {{- end }}
  {{- if $p.backup.enabled }}
  # ⭐ the WAL archiver: every finished segment goes to the object store, so a restore can replay
  #    up to any second; a failed archive keeps the segment on disk (and pages, D3) until it lands
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: { barmanObjectName: {{ $p.backup.objectStore }} }
  {{- end }}
  {{- with $p.readerRole }}
  {{- if .name }}
  managed:
    roles:
      # ⭐ A login and nothing else. What it may read is granted column by column by the apps'
      #    db-grants hook (the tables are the apps'): status + next_attempt_at of the two queues.
      - name: {{ .name }}
        ensure: present
        login: true
        connectionLimit: 4
        passwordSecret: { name: {{ .secret }} }
  {{- end }}
  {{- end }}
  affinity: # never two instances on one node: a drain or a node failure keeps one
    enablePodAntiAffinity: true
    podAntiAffinityType: required
