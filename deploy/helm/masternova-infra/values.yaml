# Needs the CloudNativePG operator (cnpg-system) and the Secrets masternova-db and
# masternova-redis (`make k8s-secrets`) to exist first.

postgres:
  instances: 2 # primary + hot standby; CNPG fails over between them
  # "standard" = PostgreSQL + common extensions (pgvector checked in it); pinned to the major
  image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  database: masternova
  owner: masternova
  ownerSecret: masternova-db # kubernetes.io/basic-auth, shared with the apps
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  parameters:
    shared_buffers: 128MB
    max_connections: "100"
    # ⭐ D5.2: which statements cost the most in total (calls × mean), not which one looks slow. Any
    #    pg_stat_statements.* parameter makes CNPG preload the library and create the extension.
    #    Changing shared_preload_libraries restarts Postgres: CNPG rolls the standby, then switches over.
    pg_stat_statements.max: "5000"
    pg_stat_statements.track: top
  # Backups + point-in-time recovery (D5.4, docs/runbooks/restore-database.md). Needs the Barman
  # Cloud plugin in cnpg-system (`make k8s-platform`). Off by default: a chart user opts in with a
  # bucket of their own.
  backup:
    enabled: false
    objectStore: masternova-backups
    destinationPath: s3://masternova-backups/
    endpointURL: http://seaweedfs:8333
    credentialsSecret: masternova-backup-s3
    devCredentials: false # true only where the S3 accepts any key (the local SeaweedFS)
    retention: 7d # base backups + WAL older than this go: the PITR window
    schedule: "0 0 3 * * *" # daily, 03:00 UTC
    # how stale the newest archived WAL may get on a quiet database: the RPO bound
    archiveTimeout: 60s
  # Roles the operator keeps in sync (created, password from the Secret, kept present). The
  # autoscaler reads queue depths with this one: two columns of two tables (granted by the apps'
  # db-grants hook), no writes, no DDL (devops/06 §6). "" = none.
  readerRole:
    name: keda_reader
    secret: masternova-db-reader # kubernetes.io/basic-auth, username = the role name

# CloudPirates Redis chart (official image). A cache + pub/sub only (ADR-0016): no persistence.
redis:
  fullnameOverride: redis # Service `redis` = REDIS_HOST
  architecture: standalone
  auth:
    enabled: true
    existingSecret: masternova-redis
    existingSecretPasswordKey: password
  persistence:
    enabled: false
  config:
    content: |
      bind * -::*
      save ""
      appendonly no
      maxmemory 96mb
      maxmemory-policy allkeys-lru
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

seaweedfs:
  enabled: true # S3 for media (ADR-0012); false where real S3 exists
  image: chrislusf/seaweedfs:4.48
  bucket: masternova-media
  storage: 5Gi
  corsOrigins: [] # the SPA's origins: the browser PUTs presigned parts straight to storage

mailpit:
  enabled: true # a local inbox; a real environment sends through Resend (MAIL_PROVIDER)
  image: axllent/mailpit:v1.31.5

ingress:
  className: traefik
  clusterIssuer: ""
  s3Host: "" # presigned urls (the apps' STORAGE_PUBLIC_ENDPOINT); "" = not exposed
  mailHost: "" # Mailpit's UI; "" = not exposed
