{{- $c := dict "root" . "component" "web" -}}
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "masternova.labels" $c | nindent 4 }}
spec:
  selector: {{- include "masternova.selectorLabels" $c | nindent 4 }}
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "masternova.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "masternova.selectorLabels" $c | nindent 6 }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "masternova.labels" $c | nindent 8 }}
    spec:
      {{- include "masternova.podSpec" dict | nindent 6 }}
      {{- include "masternova.spreadAcrossNodes" $c | nindent 6 }}
      containers:
        - name: web
          image: {{ include "masternova.image" (dict "root" . "app" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          env: # the CSP's storage origin (D5.5): where browsers upload to and stream from
            - { name: STORAGE_ORIGIN, value: {{ .Values.config.STORAGE_PUBLIC_ENDPOINT | default "http://localhost:9010" | quote }} }
          # nginx's master starts as root to bind :80, then drops to `nginx`: compose's exact set.
          # `baseline` allows it; the reason the namespace can't enforce `restricted`.
          {{- include "masternova.restrictedContainer" (dict "add" (list "CHOWN" "SETUID" "SETGID" "NET_BIND_SERVICE")) | nindent 10 }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop: { sleep: { seconds: 5 } }
          volumeMounts:
            - { name: run, mountPath: /var/run }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - { name: cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
