{{- if .Values.ingress.enabled }}
{{- $c := dict "root" . "component" "ingress" -}}
# https://<host>/api/… → api (no nginx hop), everything else → web
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masternova
  labels: {{- include "masternova.labels" $c | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }} # ingress-shim issues + renews the tls Secret
    {{- end }}
    {{- if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: masternova-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
{{- with .Values.ingress.httpsRedirectPort }}
---
# http → https on a non-standard port: Traefik's entry-point redirect would drop the port
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels: {{- include "masternova.labels" $c | nindent 4 }}
spec:
  redirectScheme: { scheme: https, port: {{ . | quote }}, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masternova-http
  labels: {{- include "masternova.labels" $c | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-redirect-https@kubernetescrd
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $.Values.ingress.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }] }
{{- end }}
{{- end }}
