# Loki, single binary on local disk (compose profile `observability`). DevOps note 05 §5.
# Alloy pushes the containers' log lines here; Grafana queries them with LogQL.
auth_enabled: false # one tenant on a laptop

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  # ⭐ traceId / spanId are stored per line as structured metadata — NOT as labels: a label value
  #    per trace would make a stream per request (the cardinality rule again, note 05 §2.3)
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true # actually delete lines older than retention_period
  delete_request_store: filesystem
