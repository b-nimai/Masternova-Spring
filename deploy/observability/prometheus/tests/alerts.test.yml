# Unit tests for the alert rules: synthetic series in, expected alerts out. `make obs-check` and CI
# run them with `promtool test rules`. DevOps note 05 §6.4.
rule_files:
  - ../rules/slo.rules.yml
  - ../rules/symptoms.rules.yml

evaluation_interval: 1m

tests:
  # ---- availability: 10 % of requests fail → over 14.4 × 0.5 % = 7.2 %: page, and the ticket too
  - name: a 10 % error rate pages
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="200"}'
        values: '0+90x420'
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="500"}'
        values: '0+10x420'
      # Prometheus' own scrapes must not dilute the ratio
      - series: 'http_server_requests_seconds_count{application="api",uri="/actuator/prometheus",status="200"}'
        values: '0+1000x420'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApiAvailabilityFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: api-availability }
            exp_annotations:
              summary: 'Api availability SLO is burning its error budget at 14.4× or more (over 1h and 5m)'
              description: 'Error ratio over 1h: 10% (budget 0.5 %). SLO: 99.5 % of api requests succeed on the server (no 5xx).'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/api-availability.md
      - eval_time: 7h
        alertname: ApiAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: { severity: ticket, slo: api-availability }
            exp_annotations:
              summary: 'Api availability SLO is burning its error budget at 6× or more (over 6h and 30m)'
              description: 'Error ratio over 6h: 10% (budget 0.5 %). SLO: 99.5 % of api requests succeed on the server (no 5xx).'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/api-availability.md

  # ---- 4 %: above the ticket line (3 %), below the page line (7.2 %)
  - name: a 4 % error rate opens a ticket but does not page
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="200"}'
        values: '0+96x420'
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="503"}'
        values: '0+4x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: ApiAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ApiAvailabilitySlowBurn
        exp_alerts:
          - exp_labels: { severity: ticket, slo: api-availability }
            exp_annotations:
              summary: 'Api availability SLO is burning its error budget at 6× or more (over 6h and 30m)'
              description: 'Error ratio over 6h: 4% (budget 0.5 %). SLO: 99.5 % of api requests succeed on the server (no 5xx).'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/api-availability.md

  # ---- the short window is what resolves an alert: an hour of errors, then 10 healthy minutes
  - name: the page resolves soon after the errors stop, though the 1 h window still remembers them
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="200"}'
        values: '0+90x60 5400+100x20'
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="500"}'
        values: '0+10x60 600+0x20'
    alert_rule_test:
      - eval_time: 58m
        alertname: ApiAvailabilityFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: api-availability }
            exp_annotations:
              summary: 'Api availability SLO is burning its error budget at 14.4× or more (over 1h and 5m)'
              description: 'Error ratio over 1h: 10% (budget 0.5 %). SLO: 99.5 % of api requests succeed on the server (no 5xx).'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/api-availability.md
      - eval_time: 70m
        alertname: ApiAvailabilityFastBurn
        exp_alerts: [] # 1 h ratio is still ~9 %, but the last 5 minutes are clean
    promql_expr_test:
      - expr: slo:api_availability:error_ratio_rate1h > bool 0.072
        eval_time: 70m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: no traffic, no alert
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="200"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ApiAvailabilityFastBurn
        exp_alerts: []

  # ---- latency: the page line is 14.4 × 5 % = 72 % of requests slower than 300 ms
  - name: most requests slower than 300 ms pages
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="api",uri="/api/v1/courses",status="200",le="0.3"}'
        values: '0+20x90'
      - series: 'http_server_requests_seconds_count{application="api",uri="/api/v1/courses",status="200"}'
        values: '0+100x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiLatencyFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: api-latency }
            exp_annotations:
              summary: 'Api latency SLO is burning its error budget at 14.4× or more (over 1h and 5m)'
              description: 'Error ratio over 1h: 80% (budget 5 %). SLO: 95 % of api requests answer within 300 ms.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/api-latency.md

  # ---- outbox freshness: half the deliveries take longer than 60 s
  - name: slow deliveries burn the outbox budget
    interval: 1m
    input_series:
      - series: 'outbox_delivery_lag_seconds_bucket{application="worker",event_type="identity.user-registered.v1",le="60.0"}'
        values: '0+5x90'
      - series: 'outbox_delivery_lag_seconds_count{application="worker",event_type="identity.user-registered.v1"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OutboxFreshnessFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: outbox-freshness }
            exp_annotations:
              summary: 'Outbox freshness SLO is burning its error budget at 14.4× or more (over 1h and 5m)'
              description: 'Error ratio over 1h: 50% (budget 1 %). SLO: 99 % of events are handled within 60 s of their commit.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/outbox-freshness.md

  # ---- events given up on (DEAD) burn the budget although every DELIVERED one was fast
  - name: dead events count against outbox freshness
    interval: 1m
    input_series:
      - series: 'outbox_delivery_lag_seconds_bucket{application="worker",event_type="identity.user-registered.v1",le="60.0"}'
        values: '0+7x90'
      - series: 'outbox_delivery_lag_seconds_count{application="worker",event_type="identity.user-registered.v1"}'
        values: '0+7x90'
      - series: 'outbox_messages_total{application="worker",event_type="identity.user-registered.v1",outcome="dead"}'
        values: '0+3x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OutboxFreshnessFastBurn
        exp_alerts:
          - exp_labels: { severity: page, slo: outbox-freshness }
            exp_annotations:
              summary: 'Outbox freshness SLO is burning its error budget at 14.4× or more (over 1h and 5m)'
              description: 'Error ratio over 1h: 30% (budget 1 %). SLO: 99 % of events are handled within 60 s of their commit.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/outbox-freshness.md

  # ---- a dead relay: no deliveries at all (the freshness SLO goes NaN), but the backlog ages
  - name: a stalled relay pages through the overdue gauge (reported by every app)
    interval: 1m
    input_series:
      - series: 'outbox_overdue_seconds{application="worker"}'
        values: '0x5 60+60x20'
      - series: 'outbox_overdue_seconds{application="api"}'
        values: '0x5 60+60x20'
    alert_rule_test:
      - eval_time: 14m # over 300 s since 11m, but not yet for 5 minutes
        alertname: OutboxStalled
        exp_alerts: []
      - eval_time: 17m
        alertname: OutboxStalled
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: 'Outbox events are not being delivered'
              description: 'The most overdue event has waited 12m 0s past its due time.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/outbox-stalled.md

  - name: an app is down only when no instance answers
    interval: 1m
    input_series:
      - series: 'up{job="api",instance="a"}'
        values: '1x10 0x10'
      - series: 'up{job="api",instance="b"}'
        values: '1x20'
      - series: 'up{job="worker",instance="w"}'
        values: '1x5 0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: { severity: page, job: worker }
            exp_annotations:
              summary: 'worker is not answering Prometheus scrapes'
              description: 'No worker instance has answered /actuator/prometheus for 2 minutes.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/service-down.md

  # the counters start at 0 because the apps register them at startup (see the rule's comment)
  - name: a buried pipeline job opens a ticket
    interval: 1m
    input_series:
      - series: 'pipeline_jobs_dead_total{application="worker",reason="permanent"}'
        values: '0x10 1x50'
      - series: 'outbox_messages_total{application="worker",event_type="x.v1",outcome="delivered"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: DeadLetters
        exp_alerts:
          - exp_labels: { severity: ticket, kind: pipeline }
            exp_annotations:
              summary: 'New dead letters (pipeline)'
              description: '1 pipeline item(s) gave up in the last hour.'
              runbook_url: https://github.com/b-nimai/Masternova-Spring/blob/main/docs/runbooks/dead-letters.md
