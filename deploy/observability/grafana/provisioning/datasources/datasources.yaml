# Datasources as code: Grafana reads this at startup. Fixed `uid`s let dashboards (and the
# cross-links between traces, logs and metrics) refer to a datasource without knowing its id.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy # Grafana's server queries it, the browser never talks to Prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s # = the scrape interval: $__rate_interval is never shorter than 4 scrapes

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # trace → logs: a span's "Logs for this span" button runs this LogQL in Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} | traceId="$${__trace.traceId}"'
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # log → trace: the traceId structured-metadata field becomes a link that opens Tempo
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
