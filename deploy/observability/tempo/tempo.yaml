# Tempo, single binary, local disk (compose profile `observability`). DevOps note 05 §4.
# The apps push spans over OTLP/HTTP (:4318); Grafana queries Tempo's API (:3200).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318 # what Boot's OtlpHttpSpanExporter sends to (…/v1/traces)

storage:
  trace:
    backend: local # a laptop; object storage (S3) in a real deployment
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 48h # traces are for debugging now, metrics are for trends
