# Argo CD (`make k8s-platform`), small: one of each component, no SSO (dex), no notifications,
# no ApplicationSet controller (two Applications don't need a generator).
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

configs:
  params:
    server.insecure: true # Traefik terminates TLS (the ingress below); Argo serves plain http behind it
  cm:
    timeout.reconciliation: 60s # how often git is polled; a webhook from GitHub can't reach a laptop
    # ⭐ Argo CD stopped assessing an Application's health (2.x) — so in an app-of-apps, a sync
    #    wave of child Applications would NOT wait for the previous wave to be healthy. This
    #    restores it: the root waits for masternova-infra (wave 0) to be Healthy before it
    #    syncs masternova (wave 1), whose migration hook needs the database.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.masternova.localhost # https://argocd.masternova.localhost:8443
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: masternova-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure

global:
  # small requests: a laptop cluster; Argo's own defaults are none at all
  logging:
    format: json
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
