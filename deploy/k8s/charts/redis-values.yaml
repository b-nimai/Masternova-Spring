# Values for the CloudPirates Redis chart (`make k8s-redis`): the official redis image, Apache-2.0
# chart (Bitnami's free images stopped in 2025). Redis is a cache + pub/sub bus here (ADR-0016),
# so: one standalone instance, no persistence, a password.
fullnameOverride: redis # Service `redis`: REDIS_HOST stays the same as compose
architecture: standalone
auth:
  enabled: true
  existingSecret: masternova-redis # `make k8s-secrets` creates it from secrets/redis_password
  existingSecretPasswordKey: password
persistence:
  enabled: false # a restart loses cached entitlement rows, which are re-read from Postgres
config:
  content: |
    bind * -::*
    save ""
    appendonly no
    maxmemory 96mb
    maxmemory-policy allkeys-lru
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
