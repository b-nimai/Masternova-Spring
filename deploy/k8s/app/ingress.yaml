# The way in: Traefik (bundled with k3s) on host :8443 (TLS) and :8082 (redirects to TLS).
#
#   https://masternova.localhost:8443/api/…  → api:8080   (straight to the api: no nginx hop)
#   https://masternova.localhost:8443/…      → web:80     (the SPA; nginx's own /api proxy is unused here)
#   https://s3.masternova.localhost:8443     → seaweedfs  (presigned upload/segment urls, STORAGE_PUBLIC_ENDPOINT)
#   https://mail.masternova.localhost:8443   → mailpit UI
#
# *.localhost resolves to 127.0.0.1 without /etc/hosts (RFC 6761; browsers and curl do it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masternova
  namespace: masternova
  annotations:
    # ⭐ cert-manager's ingress-shim sees this and creates a Certificate for every tls host below,
    #    signed by the local CA (deploy/k3d/local-ca.yaml), renewed before expiry, stored in the
    #    Secret named in `tls`. Traefik terminates TLS with it.
    cert-manager.io/cluster-issuer: masternova-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure # TLS only; plain http is the redirect below
spec:
  ingressClassName: traefik
  tls:
    - hosts: [masternova.localhost, s3.masternova.localhost, mail.masternova.localhost]
      secretName: masternova-tls
  rules:
    - host: masternova.localhost
      http:
        paths:
          # longest prefix wins, whatever the order: /api/… never reaches nginx
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
    - host: s3.masternova.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: seaweedfs, port: { name: s3 } } } }
    - host: mail.masternova.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: mailpit, port: { name: http } } } }
---
# http → https. Traefik's usual entry-point redirect would send browsers to :443, but the host
# publishes TLS on :8443, so the redirect names the port: a Middleware (Traefik CRD) on an
# http-only Ingress for the same hosts.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: masternova
spec:
  redirectScheme: { scheme: https, port: '8443', permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masternova-http
  namespace: masternova
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: masternova-redirect-https@kubernetescrd # <namespace>-<name>
spec:
  ingressClassName: traefik
  rules:
    - host: masternova.localhost
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }] }
    - host: s3.masternova.localhost
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: seaweedfs, port: { name: s3 } } } }] }
    - host: mail.masternova.localhost
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: mailpit, port: { name: http } } } }] }
