# The web app: nginx with the Angular build, proxying /api to the `api` Service.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: masternova
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: masternova
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: masternova }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: registry.localhost:5050/masternova-spring/web:TAG
          ports: [{ name: http, containerPort: 80 }]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # nginx's master starts as root to bind :80, then drops to `nginx`: exactly compose's set
            # (allowed by `baseline`; the reason this namespace can't enforce `restricted`)
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop: { sleep: { seconds: 5 } }
          volumeMounts: # what compose mounts as tmpfs
            - { name: run, mountPath: /var/run }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - { name: cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
