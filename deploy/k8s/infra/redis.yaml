# Redis is a cache and a pub/sub bus here (never a store, ADR-0016): no volume, a restart loses
# nothing that matters. Replaced by a chart in D4.4.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: masternova
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: masternova
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: masternova }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--save, '', --appendonly, 'no'] # a cache: no snapshots, no AOF
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
