# S3 for media (ADR-0012): SeaweedFS in one pod, its data on a PVC. On AWS (D6) this is S3 itself.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: masternova
spec:
  selector: { app.kubernetes.io/name: seaweedfs }
  ports: [{ name: s3, port: 8333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: masternova
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: seaweedfs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: masternova }
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: [server, -s3, -dir=/data, -volume.max=0]
          env: # dev-only credentials, the same as compose's: the single admin identity
            - { name: AWS_ACCESS_KEY_ID, value: masternova }
            - { name: AWS_SECRET_ACCESS_KEY, value: masternova-dev-secret }
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
# compose's media-init as a Job: create the bucket + its CORS rule, then exit. Idempotent, so a
# re-apply (delete + create: a Job's pod template is immutable) is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: media-init
  namespace: masternova
spec:
  backoffLimit: 10 # seaweedfs may not be ready yet: each failure retries with a growing delay
  ttlSecondsAfterFinished: 600 # the finished Job deletes itself; `kubectl apply` recreates it
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: aws
          image: amazon/aws-cli:2.31.0
          env:
            - { name: AWS_ACCESS_KEY_ID, value: masternova }
            - { name: AWS_SECRET_ACCESS_KEY, value: masternova-dev-secret }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - name: CORS_ORIGINS # the SPA's origins: the browser PUTs presigned parts straight to storage
              value: '"https://masternova.localhost:8443","http://localhost:8082"'
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              s3="aws --endpoint-url http://seaweedfs:8333"
              $s3 s3api head-bucket --bucket masternova-media 2>/dev/null || $s3 s3api create-bucket --bucket masternova-media
              $s3 s3api put-bucket-cors --bucket masternova-media --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[$CORS_ORIGINS],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}"
              echo 'media-init: bucket + cors ready'
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
