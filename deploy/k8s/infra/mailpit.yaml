# Local SMTP inbox: every email the worker sends lands here (`kubectl port-forward svc/mailpit 8026:8025`).
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: masternova
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: masternova
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: masternova }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.5
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
