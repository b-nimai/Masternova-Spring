# Flyway as a pre-deploy Job: the schema moves BEFORE the new code rolls out, once, by one pod.
#
# Why not "every api pod migrates at startup" (what compose does):
#   - N replicas race for Flyway's lock; the losers wait inside their startup probe budget;
#   - a slow migration makes the new pods miss their startup probe and get killed mid-migration;
#   - a failed migration shows up as a crash-looping Deployment, half rolled out, instead of
#     one failed Job that stopped the rollout before it started.
# The api pods run with SPRING_FLYWAY_ENABLED=false, and Hibernate's `validate` still refuses to
# start against a schema that doesn't match, so a skipped Job fails loudly.
#
# Same image as the api (the migrations are in its jar: one artifact, no drift). It boots the
# context with -Dspring.context.exit=onRefresh — the Dockerfile's AOT training trick: Flyway runs
# during refresh, then the JVM exits 0 before the web server, runners or schedulers start.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: masternova
spec:
  backoffLimit: 2 # Flyway is transactional per migration on Postgres: a retry resumes cleanly
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-migrate, app.kubernetes.io/part-of: masternova }
    spec:
      restartPolicy: Never # a failed pod stays for `kubectl logs`; the Job makes a new one
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: registry.localhost:5050/masternova-spring/api:TAG
          envFrom: [{ configMapRef: { name: masternova-config } }]
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Dspring.context.exit=onRefresh
            - { name: SPRING_FLYWAY_ENABLED, value: 'true' }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '2', memory: 768Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: secrets
          projected:
            sources:
              - secret:
                  name: masternova-app
                  items: [{ key: JWT_ACCESS_SECRET, path: JWT_ACCESS_SECRET }] # the context validates it
              - secret:
                  name: masternova-db
                  items:
                    - { key: username, path: DATABASE_USER }
                    - { key: password, path: DATABASE_PASSWORD }
