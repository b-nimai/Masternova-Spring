# CI: every push and PR runs only the jobs whose files changed.
#   backend      → mvn verify (unit + Spring Modulith + Testcontainers ITs + Spotless + JaCoCo gate)
#   patterns-lab → mvn test
#   frontend     → lint, unit tests (Vitest), production build
#   workflows    → actionlint on every workflow file
#   e2e          → the whole stack in compose + Playwright in Chromium (sign up, log in, reload, …)
#   images       → build all three Docker images for amd64 AND arm64 (each on its own native runner),
#                  scan each with Trivy (fails on fixable HIGH/CRITICAL); on main, push the scanned
#                  images by digest, with SBOM + provenance attestations
#   publish      → on main: one tag for both platforms (:sha-<commit>, :main), signed keylessly with cosign
#   helm         → lint both charts, validate what they render (kubeconform, CRD schemas included)
#   secrets      → gitleaks over the WHOLE git history, on every run (no path filter: a secret can
#                  arrive in any file)
#   e2e (+ DAST) → after Playwright, OWASP ZAP's baseline scans the same running stack
# Versioned releases (vX.Y.Z tags) live in release.yml. Deploying is GitOps (D4.7): a commit that
# changes the image tag in deploy/helm/masternova/values-local.yaml, synced by Argo CD.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's still-running CI. NEVER on main: each main commit's run
# publishes that commit's images (:sha-…), which is what deployments pin. Found in D4.5: merging
# a docs PR right after a phase PR cancelled the phase's run, and the docs commit builds no
# images (path filters), so Phases 8 and 9 never got an api/worker image. A group per commit on
# main (not just "don't cancel": a group keeps one PENDING run, and a third push replaces it).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      lab: ${{ steps.filter.outputs.lab }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      e2e: ${{ steps.filter.outputs.e2e }}
      observability: ${{ steps.filter.outputs.observability }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'patterns/README.md'
              - '.github/workflows/ci.yml'
            lab:
              - 'patterns/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'
            observability:
              - 'deploy/observability/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            helm:
              - 'deploy/helm/**'
              - 'deploy/argocd/**'
              - 'deploy/k3d/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            e2e:
              - 'e2e/**'
              - 'compose.yaml'
              - 'docs/db/seed-catalog.sql'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # the worker's pipeline ITs run the real ffmpeg / ffprobe on a generated clip (Phase 7)
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: backend/*/target/site/jacoco/
          if-no-files-found: ignore
      - name: Upload SBOMs (CycloneDX, one per app; also inside each jar)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-maven
          path: backend/*/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # a typo in a workflow otherwise surfaces only when that path runs (often on main, or at release)
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color
      - name: Every action version exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-action-refs.sh

  # Prometheus config, alert-rule unit tests, Alertmanager config, and every dashboard query parsed
  # by promtool (D3.5). The same command as locally: the Makefile pins the tool images.
  observability:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make obs-check

  # Both Helm charts: `helm lint --strict`, then everything they render — and the Argo CD and
  # cluster manifests — validated against the Kubernetes API schemas and the CRDs' (CNPG Cluster,
  # Traefik Middleware, KEDA, Argo CD Application/AppProject, cert-manager) by kubeconform (D4.5).
  # A chart error otherwise surfaces when Argo CD syncs it — after the merge.
  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1 # = local (`helm version`)
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - run: make helm-check

  patterns-lab:
    needs: changes
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patterns/lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    name: image (${{ matrix.app.name }}, ${{ matrix.arch }})
    needs: [changes, backend, frontend]
    # run when either side changed and neither side failed (a skipped job is fine)
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    # ⭐ Native runners, not QEMU: the k3d nodes on an Apple-silicon laptop are arm64, and CI's
    #    amd64-only images left the first GitOps deploy in ImagePullBackOff ("no match for platform
    #    in manifest", devops/06 §7). Emulating arm64 makes a Maven build several times slower.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN (no stored secret)
    env:
      # Only main publishes. PRs build and scan the same images but never push them.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/masternova-spring-${{ matrix.app.name }}
    outputs:
      day: ${{ steps.day.outputs.day }} # e2e rebuilds from the same cache: same refresh key
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: api, context: backend, args: "APP=api" }
          - { name: worker, context: backend, args: "APP=worker\nPORT=8090" }
          - { name: web, context: frontend, args: "" }
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      # The day busts the cached `apk upgrade` layer once a day (a CVE fixed upstream yesterday
      # must not hide behind last week's layer); the push below shares it, so it stays a cache hit.
      - name: Package refresh key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.app.name }} (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }}
          build-args: |
            ${{ matrix.app.args }}
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ steps.day.outputs.day }}
          tags: masternova-spring/${{ matrix.app.name }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ matrix.app.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}-${{ matrix.arch }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: masternova-spring/${{ matrix.app.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # ⭐ Push only what passed the scan: the same build again, served from the layer cache.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Untagged, by digest: the publish job puts both platforms under one tag once all are pushed.
      - name: Push ${{ matrix.app.name }} (${{ matrix.arch }})
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }}
          build-args: |
            ${{ matrix.app.args }}
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ steps.day.outputs.day }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app.name }}-${{ matrix.arch }}
          # attestations stored next to the image: an SBOM of everything in it, and how it was built
          sbom: true
          provenance: mode=max
      - name: Hand the digest to the publish job
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.app.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish (${{ matrix.name }})
    needs: images
    # main only, and only when every platform of every image built, passed its scan and pushed
    if: >-
      !cancelled() && needs.images.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN (no stored secret)
      id-token: write # an OIDC token for keyless cosign signing (no signing key to store or leak)
    strategy:
      fail-fast: false
      matrix:
        name: [api, worker, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/masternova-spring-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # sha-<7 chars>: immutable, one per commit (what deployments pin) · main: moving pointer
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
      # ⭐ A registry-side operation: one index that lists both platforms' manifests (and their
      #    attestations); a node pulls the one matching its architecture.
      - name: One tag, both platforms
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "expected 2 platform digests, got: $*"; exit 1; }
          # shellcheck disable=SC2046,SC2086 # one -t per tag, one source per digest
          docker buildx imagetools create $(printf -- '-t %s ' $TAGS) $(printf "$IMAGE@sha256:%s " "$@")
          tag="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2 # this action publishes no moving major tag
      # ⭐ Keyless: GitHub's OIDC token proves "this workflow, this repo, this ref" to Sigstore,
      #    which issues a 10-minute certificate; the signature lands in the public Rekor log.
      #    Signing the DIGEST covers every tag that points at it, including later release tags.
      - name: Sign ${{ matrix.name }}
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # ⭐ The whole history, not the diff: a secret committed and deleted later is still in git, and
  #    only rotating it fixes that. Same command as `make secrets-scan` (.gitleaks.toml allowlists
  #    only test fixtures under src/test).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (all commits)
        run: make secrets-scan

  e2e:
    needs: [changes, images]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The images job just built these (amd64: this runner); with the same inputs every layer
      # comes from its cache.
      - name: Load api image
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-args: |
            APP=api
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ needs.images.outputs.day }}
          tags: masternova-spring/api:local
          load: true
          cache-from: type=gha,scope=api-amd64
      - name: Load worker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-args: |
            APP=worker
            PORT=8090
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ needs.images.outputs.day }}
          tags: masternova-spring/worker:local
          load: true
          cache-from: type=gha,scope=worker-amd64
      - name: Load web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          build-args: |
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ needs.images.outputs.day }}
          tags: masternova-spring/web:local
          load: true
          cache-from: type=gha,scope=web-amd64
      - name: Start the stack
        run: |
          make secrets
          docker compose --profile app up -d --wait postgres redis mailpit api worker web
      - name: Seed the catalog (the api has applied its migrations by now)
        run: make seed COURSES=60
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: pnpm test
      # ⭐ DAST on the stack Playwright just used: spider + passive rules (headers, cookies,
      #    information leaks), no attacks. .zap/rules.tsv decides what FAILs; the rest is a WARN in
      #    the report. A finding is fixed in nginx/Spring Security or justified in rules.tsv.
      - name: DAST (OWASP ZAP baseline)
        run: make zap
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap
          path: .zap/report.*
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color --tail 300 api worker web

  # ⭐ The ONE check branch protection requires. Path filters skip jobs whose files didn't change,
  #    and the job list grows over time; this job turns "every job passed or was skipped" into a
  #    single stable status, so the protection rule never needs editing.
  ci-ok:
    if: always()
    needs: [changes, backend, patterns-lab, frontend, workflows, observability, helm, secrets, images, publish, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
