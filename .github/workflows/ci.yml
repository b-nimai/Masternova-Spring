# CI: every push and PR runs only the jobs whose files changed.
#   backend      → mvn verify (unit + Spring Modulith + Testcontainers ITs + Spotless + JaCoCo)
#   patterns-lab → mvn test
#   frontend     → lint, unit tests (Vitest), production build
#   images       → build all three Docker images, scan with Trivy (fails on fixable HIGH/CRITICAL)
# Publishing images to GHCR and deploying come in Phase D2 / D4.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency: # a new push cancels the still-running CI of the previous one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      lab: ${{ steps.filter.outputs.lab }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'patterns/README.md'
              - '.github/workflows/ci.yml'
            lab:
              - 'patterns/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: backend/*/target/site/jacoco/
          if-no-files-found: ignore

  patterns-lab:
    needs: changes
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patterns/lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    name: image (${{ matrix.name }})
    needs: [changes, backend, frontend]
    # run when either side changed and neither side failed (a skipped job is fine)
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, args: "APP=api" }
          - { name: worker, context: backend, args: "APP=worker\nPORT=8090" }
          - { name: web, context: frontend, args: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          tags: masternova-spring/${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: masternova-spring/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
