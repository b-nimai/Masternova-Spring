# CI: every push and PR runs only the jobs whose files changed.
#   backend      → mvn verify (unit + Spring Modulith + Testcontainers ITs + Spotless + JaCoCo gate)
#   patterns-lab → mvn test
#   frontend     → lint, unit tests (Vitest), production build
#   workflows    → actionlint on every workflow file
#   images       → build all three Docker images, scan with Trivy (fails on fixable HIGH/CRITICAL);
#                  on main, push the scanned images to GHCR as :sha-<commit> and :main, with SBOM +
#                  provenance attestations, and sign them keylessly with cosign
# Versioned releases (vX.Y.Z tags) live in release.yml; deploying comes in Phase D4.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency: # a new push cancels the still-running CI of the previous one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      lab: ${{ steps.filter.outputs.lab }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'patterns/README.md'
              - '.github/workflows/ci.yml'
            lab:
              - 'patterns/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: backend/*/target/site/jacoco/
          if-no-files-found: ignore
      - name: Upload SBOMs (CycloneDX, one per app; also inside each jar)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-maven
          path: backend/*/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # a typo in a workflow otherwise surfaces only when that path runs (often on main, or at release)
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color

  patterns-lab:
    needs: changes
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patterns/lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  images:
    name: image (${{ matrix.name }})
    needs: [changes, backend, frontend]
    # run when either side changed and neither side failed (a skipped job is fine)
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN (no stored secret)
      id-token: write # an OIDC token for keyless cosign signing (no signing key to store or leak)
    env:
      # Only main publishes. PRs build and scan the same images but never push them.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, args: "APP=api" }
          - { name: worker, context: backend, args: "APP=worker\nPORT=8090" }
          - { name: web, context: frontend, args: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Image names, tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/masternova-spring-${{ matrix.name }}
          # sha-<7 chars>: immutable, one per commit (what deployments pin) · main: moving pointer
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            ${{ matrix.args }}
            GIT_SHA=${{ github.sha }}
          tags: masternova-spring/${{ matrix.name }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: masternova-spring/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # ⭐ Push only what passed the scan: the same build again, served from the layer cache.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.name }}
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            ${{ matrix.args }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          # attestations stored next to the image: an SBOM of everything in it, and how it was built
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4
        if: env.PUBLISH == 'true'
      # ⭐ Keyless: GitHub's OIDC token proves "this workflow, this repo, this ref" to Sigstore,
      #    which issues a 10-minute certificate; the signature lands in the public Rekor log.
      #    Signing the DIGEST covers every tag that points at it, including later release tags.
      - name: Sign ${{ matrix.name }}
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/masternova-spring-${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # ⭐ The ONE check branch protection requires. Path filters skip jobs whose files didn't change,
  #    and the job list grows over time; this job turns "every job passed or was skipped" into a
  #    single stable status, so the protection rule never needs editing.
  ci-ok:
    if: always()
    needs: [changes, backend, patterns-lab, frontend, workflows, images]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
