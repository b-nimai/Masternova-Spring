# Masternova-Spring local stack.
#
#   docker compose up -d                       # infra only (what `make up` runs) — apps run from your IDE / mvnw / pnpm
#   docker compose --profile app up -d --build # infra + api + worker + web, all in containers
#
# Host ports are offset from the defaults (5433, 6380, 9010, 8026 …) so this can run next to
# the NestJS Masternova stack or a native Postgres without clashing.
#
# Hardening (D1.4, patterns/devops/03): every service has log rotation and a restart policy; the
# app containers also get memory/CPU/pids limits, a read-only root filesystem, no Linux
# capabilities, and their secrets as files. `make stack` creates the gitignored secret files.

name: masternova-spring

x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/masternova
  DATABASE_USER: masternova
  DATABASE_PASSWORD: masternova
  REDIS_HOST: redis
  REDIS_PORT: 6379
  LOG_VERIFICATION_LINKS: 'false' # never log live tokens outside a developer's own terminal

# Without rotation the json-file log of a chatty container grows until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Shared by api and worker. The numbers come from patterns/devops/02: the api's working set is
# ~350 MB, and 75 % heap + ~250 MB non-heap fits in 1 GiB.
x-jvm-app: &jvm-app
  restart: unless-stopped # come back after a crash or an ExitOnOutOfMemoryError (not after `docker compose stop`)
  read_only: true # nothing in the image may change at runtime …
  tmpfs:
    - /tmp:size=64m # … except /tmp: Tomcat's work dir and the JVM's perf data
  cap_drop: [ALL] # a non-root JVM on port 8080/8090 needs no Linux capabilities at all
  security_opt: ['no-new-privileges:true'] # setuid binaries can't raise privileges
  stop_grace_period: 40s # Spring's graceful shutdown drains requests for up to 30 s
  deploy:
    resources:
      limits:
        memory: 1g # the JVM sizes its heap from this (MaxRAMPercentage=75 → 768 MB)
        cpus: '2'
        pids: 512 # a runaway thread/process leak hits this, not the host
  memswap_limit: 1g # = the memory limit: no swap; a swapping GC is worse than a restart
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: masternova
      POSTGRES_USER: masternova
      POSTGRES_PASSWORD: masternova
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masternova -d masternova']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      # Spring Boot's Docker Compose support only auto-detects the official `postgres` image.
      org.springframework.boot.service-connection: postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ⚠️ MinIO stopped publishing its images (minio/minio and quay.io/minio/* are no longer
  #    pullable as of 2026-10-02). Opt-in until Phase 7 picks a replacement S3 server:
  #    `docker compose --profile media up -d` works only where the image is already cached.
  minio:
    profiles: [media]
    image: minio/minio:latest
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9010:9000' # S3 API
      - '9011:9001' # web console — http://localhost:9011
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket once. CORS must expose ETag: the browser's multipart uploader reads
  # it off each part response to build the CompleteMultipartUpload request (Phase 7).
  minio-init:
    profiles: [media]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/masternova-media;
      mc anonymous set download local/masternova-media/public;
      mc admin config set local api cors_allow_origin='http://localhost:4200,http://localhost:8081';
      echo 'minio-init: bucket + cors ready';
      "
    restart: 'no' # a one-shot job: run once, exit 0, stay stopped
    logging: *logging
    labels:
      org.springframework.boot.ignore: true

  mailpit: # local SMTP inbox — every email the worker sends lands at http://localhost:8026
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - '1026:1025' # SMTP
      - '8026:8025' # web UI

  # ---- applications (profile: app) ----

  api:
    profiles: [app]
    build:
      context: ./backend
      args:
        APP: api
    image: masternova-spring/api:local # healthcheck: built into the image (backend/healthcheck.sh)
    <<: *jvm-app
    environment:
      <<: *app-env
    # ⭐ A file at /run/secrets/JWT_ACCESS_SECRET, not an env var: env vars show up in
    #    `docker inspect`, /proc/<pid>/environ and crash reports. Spring reads the file through
    #    `spring.config.import: optional:configtree:/run/secrets/` (application.yaml).
    secrets:
      - source: jwt_access_secret
        target: JWT_ACCESS_SECRET
      - source: notification_token_secret # verifies unsubscribe links (the worker signs them)
        target: NOTIFICATION_TOKEN_SECRET
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: [app]
    build:
      context: ./backend
      args:
        APP: worker
        PORT: 8090
    image: masternova-spring/worker:local
    <<: *jvm-app
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: http://localhost:8081 # links in emails open the containerised web app
    secrets:
      - source: notification_token_secret # signs unsubscribe links; the api verifies them
        target: NOTIFICATION_TOKEN_SECRET
    ports:
      - '8090:8090'
    depends_on:
      api: # the api runs Flyway; the worker starts once the schema exists
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: [app]
    build: ./frontend
    image: masternova-spring/web:local
    restart: unless-stopped
    read_only: true
    tmpfs: # nginx writes only its pid file, temp bodies and proxy cache
      - /var/run
      - /var/cache/nginx
      - /tmp
    # nginx's master starts as root to bind :80, then drops to the `nginx` user for its workers:
    # keep exactly the capabilities that needs, drop everything else.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
          pids: 128
    memswap_limit: 128m
    logging: *logging
    ports:
      - '8081:80' # http://localhost:8081
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:

secrets:
  jwt_access_secret:
    file: ./secrets/jwt_access_secret # gitignored; `make secrets` generates a random one
  notification_token_secret:
    file: ./secrets/notification_token_secret # shared by api + worker (same HMAC key)
