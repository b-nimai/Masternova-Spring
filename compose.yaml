# Masternova-Spring local stack.
#
#   docker compose up -d                       # infra only (what `make up` runs) — apps run from your IDE / mvnw / pnpm
#   docker compose --profile app up -d --build # infra + api + worker + web, all in containers
#   docker compose --profile observability up -d # Prometheus, Grafana … (`make obs`, DevOps note 05)
#
# Host ports are offset from the defaults (5433, 6380, 9010, 8026 …) so this can run next to
# the NestJS Masternova stack or a native Postgres without clashing.
#
# Hardening (D1.4, patterns/devops/03): every service has log rotation and a restart policy; the
# app containers also get memory/CPU/pids limits, a read-only root filesystem, no Linux
# capabilities, and their secrets as files. `make stack` creates the gitignored secret files.

name: masternova-spring

x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/masternova
  DATABASE_USER: masternova
  DATABASE_PASSWORD: masternova
  REDIS_HOST: redis
  REDIS_PORT: 6379
  STORAGE_ENDPOINT: http://seaweedfs:8333 # how the containers reach storage …
  STORAGE_PUBLIC_ENDPOINT: http://localhost:9010 # … and how the browser does (presigned urls)
  LOG_VERIFICATION_LINKS: 'false' # never log live tokens outside a developer's own terminal

# Without rotation the json-file log of a chatty container grows until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Shared by api and worker. The numbers come from patterns/devops/02: the api's working set is
# ~350 MB, and 75 % heap + ~250 MB non-heap fits in 1 GiB.
x-jvm-app: &jvm-app
  restart: unless-stopped # come back after a crash or an ExitOnOutOfMemoryError (not after `docker compose stop`)
  read_only: true # nothing in the image may change at runtime …
  tmpfs:
    - /tmp:size=64m # … except /tmp: Tomcat's work dir and the JVM's perf data
  cap_drop: [ALL] # a non-root JVM on port 8080/8090 needs no Linux capabilities at all
  security_opt: ['no-new-privileges:true'] # setuid binaries can't raise privileges
  stop_grace_period: 40s # Spring's graceful shutdown drains requests for up to 30 s
  deploy:
    resources:
      limits:
        memory: 1g # the JVM sizes its heap from this (MaxRAMPercentage=75 → 768 MB)
        cpus: '2'
        pids: 512 # a runaway thread/process leak hits this, not the host
  memswap_limit: 1g # = the memory limit: no swap; a swapping GC is worse than a restart
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: masternova
      POSTGRES_USER: masternova
      POSTGRES_PASSWORD: masternova
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masternova -d masternova']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      # Spring Boot's Docker Compose support only auto-detects the official `postgres` image.
      org.springframework.boot.service-connection: postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 for media (Phase 7). SeaweedFS replaced MinIO, whose images stopped being published
  # (ADR-0012).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *logging
    command: server -s3 -dir=/data -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: masternova # dev-only credentials: the single admin identity
      AWS_SECRET_ACCESS_KEY: masternova-dev-secret
    ports:
      - '9010:8333' # S3 API — the presigned urls browsers use point here
    volumes:
      - mediadata:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the media bucket and its CORS rule (idempotent: safe to re-run). The browser PUTs
  # presigned parts straight to storage, so only the SPA's origins may; ETag is exposed for the
  # uploader's per-part log (the server completes the upload from ListParts, ADR-0014).
  media-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: masternova
      AWS_SECRET_ACCESS_KEY: masternova-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        s3="aws --endpoint-url http://seaweedfs:8333"
        $$s3 s3api head-bucket --bucket masternova-media 2>/dev/null || $$s3 s3api create-bucket --bucket masternova-media
        $$s3 s3api put-bucket-cors --bucket masternova-media --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:4200","http://localhost:8081"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}'
        echo 'media-init: bucket + cors ready'
    restart: 'no' # a one-shot job: run once, exit 0, stay stopped
    logging: *logging
    labels:
      org.springframework.boot.ignore: true

  mailpit: # local SMTP inbox — every email the worker sends lands at http://localhost:8026
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *logging
    ports:
      - '1026:1025' # SMTP
      - '8026:8025' # web UI

  # ---- applications (profile: app) ----

  api:
    profiles: [app]
    build:
      context: ./backend
      args:
        APP: api
    image: masternova-spring/api:local # healthcheck: built into the image (backend/healthcheck.sh)
    <<: *jvm-app
    environment:
      <<: *app-env
    # ⭐ A file at /run/secrets/JWT_ACCESS_SECRET, not an env var: env vars show up in
    #    `docker inspect`, /proc/<pid>/environ and crash reports. Spring reads the file through
    #    `spring.config.import: optional:configtree:/run/secrets/` (application.yaml).
    secrets:
      - source: jwt_access_secret
        target: JWT_ACCESS_SECRET
      - source: notification_token_secret # verifies unsubscribe links (the worker signs them)
        target: NOTIFICATION_TOKEN_SECRET
      - source: playback_token_secret # signs the HLS playback tickets (api only)
        target: PLAYBACK_TOKEN_SECRET
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init: # the bucket + its CORS rule exist before the first upload
        condition: service_completed_successfully

  worker:
    profiles: [app]
    build:
      context: ./backend
      args:
        APP: worker
        PORT: 8090
    image: masternova-spring/worker:local
    <<: *jvm-app
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: http://localhost:8081 # links in emails open the containerised web app
      # ⭐ ffmpeg runs INSIDE this container's memory limit, beside the JVM: a smaller heap share
      #    than the api's 75 %, and more memory overall (video-pipeline LLD §9)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40 -XX:+ExitOnOutOfMemoryError
      PIPELINE_WORK_DIR: /var/lib/pipeline
    # a rung's segments sit here until ffmpeg finishes: real disk, not the 64 MB /tmp tmpfs
    volumes:
      - pipelinework:/var/lib/pipeline
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
          pids: 512
    memswap_limit: 2g
    secrets:
      - source: notification_token_secret # signs unsubscribe links; the api verifies them
        target: NOTIFICATION_TOKEN_SECRET
    ports:
      - '8090:8090'
    depends_on:
      api: # the api runs Flyway; the worker starts once the schema exists
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: [app]
    build: ./frontend
    image: masternova-spring/web:local
    restart: unless-stopped
    read_only: true
    tmpfs: # nginx writes only its pid file, temp bodies and proxy cache
      - /var/run
      - /var/cache/nginx
      - /tmp
    # nginx's master starts as root to bind :80, then drops to the `nginx` user for its workers:
    # keep exactly the capabilities that needs, drop everything else.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
          pids: 128
    memswap_limit: 128m
    logging: *logging
    ports:
      - '8081:80' # http://localhost:8081
    depends_on:
      api:
        condition: service_healthy

  # ---- observability (profile: observability, `make obs`) — config in deploy/observability ----

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d # a laptop, not a fleet
      - --web.enable-lifecycle # POST /-/reload re-reads the config and rules
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway # the scrape goes through the host (prometheus.yml); Linux needs this alias
    ports:
      - '9091:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *logging
    environment:
      # local only: open without a login (Grafana 13 allows anonymous Viewers only) and let viewers
      # use Explore; provisioned dashboards stay read-only. admin/admin logs in for the rest.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: 'true'
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes: # everything as code: no state volume — delete the container, lose nothing
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000' # http://localhost:3001
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  mediadata:
  pipelinework: # the worker's scratch space (video-pipeline LLD §9); safe to delete
  promdata: # Prometheus' 7 days of samples

secrets:
  jwt_access_secret:
    file: ./secrets/jwt_access_secret # gitignored; `make secrets` generates a random one
  notification_token_secret:
    file: ./secrets/notification_token_secret # shared by api + worker (same HMAC key)
  playback_token_secret:
    file: ./secrets/playback_token_secret # the api's playback tickets
