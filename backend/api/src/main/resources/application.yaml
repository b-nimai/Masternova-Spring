# Defaults target the infra in ../../compose.yaml (`make up`). Every value can be overridden by
# an environment variable — that's how the container and Kubernetes deployments configure it.
spring:
  application:
    name: api
  config:
    # Secrets mounted as files (compose `secrets:`, Kubernetes Secret volumes): each file under
    # /run/secrets becomes a property named after the file, e.g. JWT_ACCESS_SECRET below.
    import: optional:configtree:/run/secrets/
  threads:
    virtual:
      enabled: true # one virtual thread per request (Java 21+): blocking JDBC without pool starvation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/masternova}
    username: ${DATABASE_USER:masternova}
    password: ${DATABASE_PASSWORD:masternova}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false # Redis is a cache and a pub/sub bus here, never a repository store
      # ⭐ a cache must never be slower than what it caches: a hung Redis fails fast and the
      #    entitlement lookup falls through to Postgres (ADR-0016). Lettuce's default is 60 s.
      timeout: 500ms
      connect-timeout: 1s
  jpa:
    open-in-view: false # no lazy loading from controllers — fetch what you need in the service
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches the entities
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      # `spring-boot:run` from backend/api starts the shared infra if it isn't running yet.
      file: ../../compose.yaml
      lifecycle-management: start-only

masternova: # → MasternovaProperties (typed + validated at startup)
  web-url: ${WEB_URL:http://localhost:4200}
  checkout:
    cart-max-items: 20
    payment-timeout: 10s
  identity: # → IdentityProperties
    # dev-only default secret (≥ 32 bytes). Every real environment sets JWT_ACCESS_SECRET.
    jwt-secret: ${JWT_ACCESS_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    secure-cookies: ${SECURE_COOKIES:false} # true behind HTTPS
    log-verification-links: ${LOG_VERIFICATION_LINKS:true} # dev convenience — false in prod
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:} # this account gets ADMIN on startup (if it exists)
  notification: # → NotificationProperties
    # verifies unsubscribe links; MUST equal the worker's value. Dev-only default (≥ 32 bytes).
    token-secret: ${NOTIFICATION_TOKEN_SECRET:dev-only-unsubscribe-secret-0123456789abcdef}
  storage: # → storage's StorageProperties (ADR-0012: SeaweedFS in dev, S3 in prod)
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9010} # empty in AWS: the SDK picks the regional one
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:} # the host browsers reach, when it differs (compose)
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:masternova-media}
    path-style: ${STORAGE_PATH_STYLE:true}
    # dev-only credentials (compose.yaml). Blank in AWS: the default chain (IRSA, instance role).
    access-key: ${STORAGE_ACCESS_KEY:masternova}
    secret-key: ${STORAGE_SECRET_KEY:masternova-dev-secret}
  media: # → MediaProperties
    part-url-ttl: 1h
    session-ttl: 24h
    # signs playback tickets (≥ 32 bytes). Dev-only default; the stack mounts a file secret.
    playback-secret: ${PLAYBACK_TOKEN_SECRET:dev-only-playback-secret-0123456789abcdef}
    playback-ttl: 6h
  entitlement: # → EntitlementProperties (ADR-0016, ADR-0017)
    cache-ttl: 5m
    # signs learner playback tokens (≥ 32 bytes). Dev-only default; the stack mounts a file secret.
    playback-secret: ${ENTITLEMENT_PLAYBACK_SECRET:dev-only-entitlement-playback-0123456789abcdef}
    token-ttl: 5m
    segment-url-ttl: 30m
  commerce: # → CommerceProperties (docs/lld/order-state-machine.md §6)
    # FAKE: a network-free Razorpay double (dev, e2e, CI: no keys needed). Every real environment
    # sets PAYMENT_PROVIDER=razorpay and the three Razorpay secrets (test-mode keys outside prod).
    provider: ${PAYMENT_PROVIDER:fake}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  outbox: # → messaging's OutboxProperties
    # ⭐ The api only WRITES events; the worker relays them (ADR-0008). A relay here would mark the
    #    worker's events as "no handler" and swallow them. (false is also the library default.)
    relay-enabled: false

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  # ⭐ request.getRemoteAddr() is the client, not nginx: Tomcat's RemoteIpValve reads
  #    X-Forwarded-For — only from internal proxies (10/8, 172.16/12, 192.168/16, 127/8), so a
  #    client can't spoof it. Playback tokens are bound to this address (ADR-0017).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness — used by Docker and Kubernetes
  tracing: # D3.3 — ADR-0015, DevOps note 05 §4
    sampling:
      # every request locally; a real environment samples (TRACING_SAMPLING_PROBABILITY=0.1).
      # The decision is the ROOT's and travels with the trace (parent-based), outbox included.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spans are exported only when an endpoint is set — deliberately NOT here: the property's mere
  # presence turns the exporter on. Compose sets MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT;
  # from source: `MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces make api`.
  observations:
    enable:
      # a span per @Scheduled poll (outbox relay every 1 s, job poller every 2 s) buries the real
      # traces; the deliveries and jobs they start have their own observations
      tasks.scheduled.execution: false
  metrics: # D3.1 — devops note 05
    tags:
      application: ${spring.application.name} # one label tells api from worker on every series
    distribution:
      # ⭐ Histogram buckets (not client-side percentiles): Prometheus aggregates them across
      #    replicas and computes any quantile later. Only the edges we will query: Micrometer's
      #    full histogram is ~54 buckets on EVERY uri × method × status series (measured in D3.1);
      #    these are 9. The 300 ms edge is the latency SLO's (D3.5).
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,300ms,500ms,1s,2s,5s
  info:
    env:
      enabled: true # publish the info.* properties below at /actuator/info
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    # The commit the image was built from (Dockerfile ARG GIT_SHA). A release tag points at a
    # commit, so /actuator/info answers "which version is running?" even for promoted images.
    commit: ${GIT_SHA:local}
