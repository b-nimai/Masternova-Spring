# The worker shares the database with the api but never migrates it — the api owns Flyway.
spring:
  application:
    name: worker
  config:
    import: optional:configtree:/run/secrets/ # file secrets, e.g. NOTIFICATION_TOKEN_SECRET
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/masternova}
    username: ${DATABASE_USER:masternova}
    password: ${DATABASE_PASSWORD:masternova}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}

masternova:
  notification: # → NotificationProperties
    web-url: ${WEB_URL:http://localhost:4200} # every link in an email starts here
    from: ${MAIL_FROM:Masternova <no-reply@masternova.dev>}
    provider: ${MAIL_PROVIDER:smtp} # smtp (Mailpit in dev) | resend
    # signs unsubscribe links; MUST equal the api's value. Dev-only default (≥ 32 bytes).
    token-secret: ${NOTIFICATION_TOKEN_SECRET:dev-only-unsubscribe-secret-0123456789abcdef}
    resend:
      api-key: ${RESEND_API_KEY:}
  storage: # → storage's StorageProperties (ADR-0012: SeaweedFS in dev, S3 in prod)
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9010} # empty in AWS: the SDK picks the regional one
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:} # the host browsers reach, when it differs (compose)
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:masternova-media}
    path-style: ${STORAGE_PATH_STYLE:true}
    # dev-only credentials (compose.yaml). Blank in AWS: the default chain (IRSA, instance role).
    access-key: ${STORAGE_ACCESS_KEY:masternova}
    secret-key: ${STORAGE_SECRET_KEY:masternova-dev-secret}
  pipeline: # → PipelineProperties (video-pipeline LLD)
    ladder: ${PIPELINE_LADDER:standard} # standard (360/720/1080p) | fast (240/360p ultrafast: dev, CI)
    slots: ${PIPELINE_SLOTS:2} # jobs at once; ffmpeg is multi-threaded, so ~cores/2
    work-dir: ${PIPELINE_WORK_DIR:/tmp/pipeline}
  outbox: # → messaging's OutboxProperties
    relay-enabled: true # ⭐ the ONLY process that consumes the outbox (ADR-0008)
    poll-interval: 1s
    batch-size: 50
    lease: 60s # longer than the slowest handler (an SMTP send) may take
    max-attempts: 10

server:
  port: ${WORKER_PORT:8090} # only actuator is served — the worker has no public API
  shutdown: graceful

management:
  info:
    env:
      enabled: true # publish the info.* properties below at /actuator/info
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    # The commit the image was built from (Dockerfile ARG GIT_SHA). A release tag points at a
    # commit, so /actuator/info answers "which version is running?" even for promoted images.
    commit: ${GIT_SHA:local}
