# The worker shares the database with the api but never migrates it — the api owns Flyway.
spring:
  application:
    name: worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/masternova}
    username: ${DATABASE_USER:masternova}
    password: ${DATABASE_PASSWORD:masternova}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}

server:
  port: ${WORKER_PORT:8090} # only actuator is served — the worker has no public API
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
