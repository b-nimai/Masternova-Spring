<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout.html :: layout(~{::main})}">
  <body>
    <main>
      <p>Thanks, <strong th:text="${displayName}">Asha</strong>, your payment went through.</p>
      <table role="presentation" style="width: 100%; border-collapse: collapse; margin: 20px 0">
        <tr th:each="line : ${lines}" style="border-bottom: 1px solid #e5e7eb">
          <td style="padding: 8px 0" th:text="${line.title}">Java from zero</td>
          <td style="padding: 8px 0; text-align: right" th:text="${line.price}">INR 499.00</td>
        </tr>
        <tr>
          <td style="padding: 8px 0; font-weight: bold">Total paid</td>
          <td style="padding: 8px 0; text-align: right; font-weight: bold" th:text="${total}">INR 499.00</td>
        </tr>
      </table>
      <p style="margin: 28px 0">
        <a th:href="${ordersUrl}" data-role="cta"
           style="display: inline-block; background: #3f51b5; color: #ffffff; padding: 12px 22px; border-radius: 6px; text-decoration: none; font-weight: bold">See your orders</a>
      </p>
      <p style="font-size: 13px; color: #6b7280">Keep this email as your receipt.</p>
    </main>
  </body>
</html>
