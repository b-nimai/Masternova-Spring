<!DOCTYPE html>
<!--
  The shared HTML skeleton every email renders through (EmailTemplate.render, Template Method).
  Email clients are not browsers: tables for layout, INLINE styles (Gmail drops <style> on
  forward, Outlook renders with Word), and a hidden preview line for the inbox list.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${subject}">Subject</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f4f4f7; font-family: Arial, Helvetica, sans-serif; color: #1f2937">
    <span style="display: none; max-height: 0; overflow: hidden" th:text="${preview}">Preview line</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width: 560px; background: #ffffff; border-radius: 8px">
            <tr>
              <td style="padding: 24px 32px 8px; font-size: 20px; font-weight: bold; color: #3f51b5">Masternova</td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 28px; font-size: 16px; line-height: 1.5">
                <th:block th:replace="${content}">content</th:block>
              </td>
            </tr>
          </table>
          <p style="font-size: 12px; color: #6b7280; margin: 16px 0 0">
            <a th:href="${webUrl}" style="color: #6b7280">Masternova</a>
            <th:block th:if="${unsubscribeUrl}">
              · <a th:href="${unsubscribeUrl}" style="color: #6b7280" data-role="unsubscribe">Unsubscribe from these emails</a>
            </th:block>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
