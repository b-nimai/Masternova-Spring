# Same-origin setup: the browser only ever talks to this nginx, so no CORS is needed.
server {
  listen 80;
  root /usr/share/nginx/html;

  # API calls go to the backend container (service name `api` on the compose/k8s network).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Hashed bundles never change — cache them for a year.
  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: unknown paths are Angular routes, so serve index.html (never cached).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
