<mat-toolbar class="toolbar">
  @if (isHandset()) {
    <button mat-icon-button type="button" aria-label="Open navigation" (click)="toggleDrawer()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a routerLink="/" class="brand">Masternova</a>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <button mat-button type="button" [matMenuTriggerFor]="userMenu" data-testid="user-menu">
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      {{ user.displayName }}
    </button>
    <mat-menu #userMenu="matMenu">
      <a mat-menu-item routerLink="/account">My account</a>
      <button mat-menu-item type="button" (click)="logout()">Log out</button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/login">Log in</a>
    <a mat-flat-button routerLink="/signup">Sign up</a>
  }
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="sidenav"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (closedStart)="drawerOpen.set(false)"
  >
    <mat-nav-list>
      @for (item of navItems(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.link === '/' }"
          (click)="closeOnHandset()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
