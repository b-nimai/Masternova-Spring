<h2 mat-dialog-title>This course changed elsewhere</h2>
<mat-dialog-content>
  <p>
    Someone saved a newer version (maybe you, in another tab). Your last change wasn't saved, so
    nothing was overwritten.
  </p>
  <p>Reload to see the latest version, then make your change again.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close data-testid="reload">Reload latest</button>
</mat-dialog-actions>
