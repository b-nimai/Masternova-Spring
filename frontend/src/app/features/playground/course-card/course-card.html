<mat-card appearance="outlined" class="card">
  <mat-card-header>
    <mat-card-title>{{ course().title }}</mat-card-title>
    <mat-card-subtitle>{{ course().category }} · ★ {{ course().rating }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="price" data-testid="price">
      @if (isFree()) {
        Free
      } @else {
        {{ priceRupees() | currency: 'INR' }}
      }
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button [disabled]="inCart()" (click)="added.emit(course())">
      {{ inCart() ? 'In cart' : 'Add to cart' }}
    </button>
  </mat-card-actions>
</mat-card>
