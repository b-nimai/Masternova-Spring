<h2 mat-dialog-title>Simulated payment</h2>
<mat-dialog-content>
  <p class="note">
    <mat-icon inline>science</mat-icon>
    This environment uses the fake payment provider. No money moves.
  </p>
  <ul>
    @for (title of data.titles; track $index) {
      <li>{{ title }}</li>
    }
  </ul>
  <p class="amount" data-testid="fake-amount">
    {{ data.payment.amountMinor | money: data.payment.currency }}
  </p>
  @if (failed()) {
    <p class="form-error" data-testid="fake-error">The simulated payment failed. Try again.</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="paying()">Cancel</button>
  <button
    mat-flat-button
    type="button"
    data-testid="fake-pay"
    (click)="pay()"
    [disabled]="paying()"
  >
    Pay {{ data.payment.amountMinor | money: data.payment.currency }}
  </button>
</mat-dialog-actions>
